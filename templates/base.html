<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1a33">
  <title>{% block title %}Secret Santa{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="logo" href="{{ url_for('santa.home') }}">🎅 Secret Santa</a>
  </header>
  <ul class="lights" aria-hidden="true">
    {% for i in range(28) %}<li></li>{% endfor %}
  </ul>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">Made with ❤️ and a sprinkle of snow</footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
